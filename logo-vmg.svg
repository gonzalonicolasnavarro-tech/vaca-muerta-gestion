<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 460" fill="none">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a3fa8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00d4e8;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4e8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a3fa8;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Patrón circuito impreso -->
    <pattern id="circuit" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="5" cy="5" r="1.5" fill="rgba(255,255,255,0.18)"/>
      <circle cx="35" cy="35" r="1.5" fill="rgba(255,255,255,0.18)"/>
      <circle cx="5" cy="35" r="1.5" fill="rgba(255,255,255,0.18)"/>
      <circle cx="35" cy="5" r="1.5" fill="rgba(255,255,255,0.18)"/>
      <circle cx="20" cy="20" r="1.5" fill="rgba(255,255,255,0.12)"/>
      <line x1="5" y1="5" x2="20" y2="5" stroke="rgba(255,255,255,0.1)" stroke-width="0.8"/>
      <line x1="20" y1="5" x2="20" y2="20" stroke="rgba(255,255,255,0.1)" stroke-width="0.8"/>
      <line x1="5" y1="35" x2="5" y2="20" stroke="rgba(255,255,255,0.1)" stroke-width="0.8"/>
      <line x1="5" y1="20" x2="20" y2="20" stroke="rgba(255,255,255,0.1)" stroke-width="0.8"/>
      <line x1="35" y1="5" x2="35" y2="20" stroke="rgba(255,255,255,0.1)" stroke-width="0.8"/>
      <line x1="35" y1="20" x2="20" y2="20" stroke="rgba(255,255,255,0.1)" stroke-width="0.8"/>
    </pattern>
    <clipPath id="shapeClip">
      <!-- Forma hexagonal tipo casa: base cuadrada con techo a la izquierda -->
      <path d="
        M 60 140
        L 60 310
        Q 60 340 90 340
        L 310 340
        Q 340 340 340 310
        L 340 160
        L 270 100
        L 200 50
        L 130 100
        L 60 140
        Z
      "/>
    </clipPath>
  </defs>

  <!-- Forma principal: hexágono con techo izquierdo -->
  <!-- Cuerpo izquierdo/base (azul oscuro) -->
  <path d="
    M 58 142
    L 58 312
    Q 58 342 88 342
    L 200 342
    L 200 48
    L 128 100
    Z
  " fill="url(#grad1)" filter="url(#glow)"/>

  <!-- Superponer patrón circuito sobre la parte izquierda -->
  <path d="
    M 58 142
    L 58 312
    Q 58 342 88 342
    L 200 342
    L 200 48
    L 128 100
    Z
  " fill="url(#circuit)"/>

  <!-- Cuerpo derecho (cyan claro) -->
  <path d="
    M 200 48
    L 200 342
    L 312 342
    Q 342 342 342 312
    L 342 162
    L 272 100
    Z
  " fill="url(#grad2)" filter="url(#glow)"/>

  <!-- Patrón circuito derecha -->
  <path d="
    M 200 48
    L 200 342
    L 312 342
    Q 342 342 342 312
    L 342 162
    L 272 100
    Z
  " fill="url(#circuit)"/>

  <!-- Sombra interna forma casa recortada (negativa) -->
  <!-- Casa interior recortada -->
  <path d="
    M 200 130
    L 130 185
    L 130 280
    L 270 280
    L 270 185
    Z
  " fill="rgba(0,0,0,0.55)"/>

  <!-- Ala inferior izquierda que sale de la casa (efecto cinta) -->
  <path d="
    M 110 290
    Q 80 310 68 340
    L 110 340
    Q 118 318 138 305
    L 195 270
    L 195 240
    Z
  " fill="url(#grad1)" opacity="0.9"/>

  <!-- Ala superior derecha que envuelve el techo (efecto cinta) -->
  <path d="
    M 205 130
    L 280 175
    L 320 150
    L 272 98
    L 200 48
    L 205 130
    Z
  " fill="url(#grad2)" opacity="0.92"/>

  <!-- Highlight borde superior izquierdo -->
  <path d="M 200 48 L 128 100 L 58 142 L 65 148 L 132 108 L 200 60 Z"
    fill="rgba(255,255,255,0.15)"/>

  <!-- Highlight borde superior derecho -->
  <path d="M 200 48 L 272 100 L 342 162 L 335 168 L 268 108 L 200 60 Z"
    fill="rgba(255,255,255,0.25)"/>

  <!-- TEXTO -->
  <text x="200" y="390"
    font-family="'Arial', 'Helvetica', sans-serif"
    font-size="38"
    font-weight="700"
    fill="white"
    text-anchor="middle"
    letter-spacing="1">Vaca Muerta Gestión</text>

  <text x="200" y="422"
    font-family="'Arial', 'Helvetica', sans-serif"
    font-size="18"
    font-weight="400"
    fill="#00d4e8"
    text-anchor="middle"
    letter-spacing="3">SOLUCIONES INTEGRALES</text>
</svg>
