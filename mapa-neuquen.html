<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapa de Neuquén</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .mapa-container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 90vh;
        }

        .mapa-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
            border-bottom: 3px solid #764ba2;
        }

        .mapa-header h1 {
            font-size: 28px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .mapa-header p {
            font-size: 14px;
            opacity: 0.9;
        }

        .mapa-content {
            display: flex;
            flex: 1;
            gap: 0;
            overflow: hidden;
        }

        .mapa-main {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        .search-box {
            padding: 15px 20px;
            background: #f8f9fa;
            border-bottom: 1px solid #e9ecef;
            display: flex;
            gap: 10px;
        }

        .search-box input {
            flex: 1;
            padding: 10px 15px;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            font-size: 14px;
            transition: all 0.3s;
        }

        .search-box input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        #mapContainer {
            flex: 1;
            position: relative;
            background: #f0f0f0;
        }

        .leaflet-container {
            background: #e8f4f8 !important;
        }

        .mapa-sidebar {
            width: 350px;
            background: white;
            border-left: 1px solid #e9ecef;
            overflow-y: auto;
            padding: 0;
            display: flex;
            flex-direction: column;
        }

        .sidebar-header {
            padding: 20px;
            background: #f8f9fa;
            border-bottom: 1px solid #e9ecef;
            font-weight: 600;
            color: #333;
        }

        .sidebar-content {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
        }

        .location-item {
            padding: 15px;
            background: white;
            border: 1px solid #e9ecef;
            border-radius: 10px;
            margin-bottom: 12px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .location-item:hover {
            background: #f8f9fa;
            border-color: #667eea;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.15);
        }

        .location-item.active {
            background: linear-gradient(135deg, #667eea15 0%, #764ba215 100%);
            border-color: #667eea;
            box-shadow: 0 0 0 2px rgba(102, 126, 234, 0.2);
        }

        .location-name {
            font-weight: 600;
            color: #333;
            margin-bottom: 6px;
            font-size: 15px;
        }

        .location-type {
            font-size: 12px;
            background: #667eea;
            color: white;
            display: inline-block;
            padding: 4px 10px;
            border-radius: 20px;
            margin-bottom: 8px;
        }

        .location-type.turismo {
            background: #10b981;
        }

        .location-type.transporte {
            background: #f59e0b;
        }

        .location-type.comercio {
            background: #ef4444;
        }

        .location-type.servicios {
            background: #8b5cf6;
        }

        .location-coords {
            font-size: 12px;
            color: #6b7280;
            margin-top: 8px;
            font-family: 'Courier New', monospace;
        }

        .info-details {
            display: none;
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid #e9ecef;
        }

        .info-details.show {
            display: block;
        }

        .info-text {
            font-size: 13px;
            color: #6b7280;
            line-height: 1.5;
            margin-bottom: 12px;
        }

        .info-link {
            display: inline-block;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 8px 14px;
            border-radius: 6px;
            text-decoration: none;
            font-size: 12px;
            font-weight: 600;
            transition: all 0.3s;
            cursor: pointer;
            border: none;
        }

        .info-link:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #6b7280;
        }

        .empty-state-icon {
            font-size: 48px;
            margin-bottom: 15px;
        }

        /* Responsivo */
        @media (max-width: 768px) {
            .mapa-container {
                height: calc(100vh - 40px);
                flex-direction: column;
            }

            .mapa-header {
                padding: 20px;
            }

            .mapa-header h1 {
                font-size: 22px;
            }

            .mapa-content {
                flex-direction: column;
            }

            .mapa-sidebar {
                width: 100%;
                max-height: 250px;
                border-left: none;
                border-top: 1px solid #e9ecef;
            }

            .search-box {
                flex-wrap: wrap;
            }

            .mapa-main {
                min-height: 300px;
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 10px;
            }

            .mapa-header {
                padding: 15px;
            }

            .mapa-header h1 {
                font-size: 18px;
            }

            .search-box {
                padding: 10px;
            }

            .mapa-sidebar {
                max-height: 200px;
            }
        }

        /* Estilos de Leaflet personalizados */
        .leaflet-popup-content-wrapper {
            border-radius: 10px;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.2);
        }

        .leaflet-popup-content {
            margin: 0;
            width: auto !important;
        }

        .popup-title {
            font-weight: 600;
            color: #333;
            margin-bottom: 4px;
        }

        .popup-desc {
            font-size: 12px;
            color: #6b7280;
        }

        .scrollbar-style::-webkit-scrollbar {
            width: 6px;
        }

        .scrollbar-style::-webkit-scrollbar-track {
            background: transparent;
        }

        .scrollbar-style::-webkit-scrollbar-thumb {
            background: #d1d5db;
            border-radius: 3px;
        }

        .scrollbar-style::-webkit-scrollbar-thumb:hover {
            background: #9ca3af;
        }

        .sidebar-content {
            scrollbar-width: thin;
            scrollbar-color: #d1d5db transparent;
        }
    </style>
</head>
<body>
    <div class="mapa-container">
        <div class="mapa-header">
            <h1>🗺️ Mapa de Neuquén</h1>
            <p>Explora ubicaciones de interés en la provincia</p>
        </div>

        <div class="mapa-content">
            <div class="mapa-main">
                <div class="search-box">
                    <input 
                        type="text" 
                        id="searchInput" 
                        placeholder="Buscar por nombre, tipo o ciudad..."
                        autocomplete="off"
                    >
                </div>
                <div id="mapContainer"></div>
            </div>

            <div class="mapa-sidebar scrollbar-style">
                <div class="sidebar-header">
                    📍 Ubicaciones
                </div>
                <div class="sidebar-content" id="locationsList">
                    <div class="empty-state">
                        <div class="empty-state-icon">🔍</div>
                        <p>No hay resultados</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Datos de ubicaciones en Neuquén
        const locations = [
            {
                id: 1,
                name: 'Neuquén Capital',
                lat: -38.9516,
                lng: -68.0585,
                type: 'turismo',
                city: 'Neuquén',
                description: 'Capital provincial, centro administrativo y comercial',
                info: 'Población: ~231.000 habitantes. Centro cultural y económico de la región.',
                link: '#neuquen-capital'
            },
            {
                id: 2,
                name: 'San Martín de los Andes',
                lat: -39.7753,
                lng: -71.3428,
                type: 'turismo',
                city: 'San Martín de los Andes',
                description: 'Destino turístico de montaña y lago',
                info: 'Famoso por sus paisajes andinos, esquí y actividades de montaña.',
                link: '#san-martin'
            },
            {
                id: 3,
                name: 'Villa La Angostura',
                lat: -40.7692,
                lng: -71.6347,
                type: 'turismo',
                city: 'Villa La Angostura',
                description: 'Pueblo turistico en el norte',
                info: 'Conocida como "la perla de Patagonia", destino de esquí y aventura.',
                link: '#villa-angostura'
            },
            {
                id: 4,
                name: 'Cipolletti',
                lat: -38.9447,
                lng: -68.3197,
                type: 'comercio',
                city: 'Cipolletti',
                description: 'Centro comercial e industrial',
                info: 'Zona agrícola e industrial importante del valle.',
                link: '#cipolletti'
            },
            {
                id: 5,
                name: 'Roca',
                lat: -39.0236,
                lng: -67.5878,
                type: 'servicios',
                city: 'Roca',
                description: 'Centro de servicios regionales',
                info: 'Importante nudo de comunicaciones terrestres.',
                link: '#roca'
            },
            {
                id: 6,
                name: 'Junín de los Andes',
                lat: -39.9447,
                lng: -71.4297,
                type: 'turismo',
                city: 'Junín de los Andes',
                description: 'Destino para pesca y montaña',
                info: 'Centro de actividades al aire libre y punto de acceso a parques nacionales.',
                link: '#junin'
            },
            {
                id: 7,
                name: 'Senillosa',
                lat: -38.8878,
                lng: -68.1956,
                type: 'comercio',
                city: 'Senillosa',
                description: 'Zona residencial y comercial',
                info: 'Zona en desarrollo con crecimiento residencial.',
                link: '#senillosa'
            },
            {
                id: 8,
                name: 'Zapala',
                lat: -38.7931,
                lng: -69.3058,
                type: 'transporte',
                city: 'Zapala',
                description: 'Centro de transporte y logística',
                info: 'Importante centro de distribución y transporte de cargas.',
                link: '#zapala'
            },
            {
                id: 9,
                name: 'Vaca Muerta Gestión',
                lat: -38.96995088652077,
                lng: -68.05742948488714,
                type: 'servicios',
                city: 'Neuquén',
                description: 'El Montañez 1385, Neuquén Capital',
                info: 'Plataforma de gestión y administración especializada en la industria de Vaca Muerta.',
                link: 'https://gonzalonicolasnavarro-tech.github.io/vaca-muerta-gestion/'
            }
        ];

        let map;
        let markers = {};
        let currentMarker = null;

        // Inicializar mapa
        function initMap() {
            map = L.map('mapContainer').setView([-39.2, -69.0], 8);

            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '© OpenStreetMap contributors',
                maxZoom: 19,
                className: 'map-tiles'
            }).addTo(map);

            addAllMarkers();
            renderLocationsList(locations);
        }

        // Agregar marcadores al mapa
        function addAllMarkers() {
            locations.forEach(location => {
                const marker = L.circleMarker([location.lat, location.lng], {
                    radius: 8,
                    fillColor: getColorByType(location.type),
                    color: getColorByType(location.type),
                    weight: 2,
                    opacity: 0.8,
                    fillOpacity: 0.7
                });

                const popupContent = `
                    <div class="popup-title">${location.name}</div>
                    <div class="popup-desc">${location.description}</div>
                `;

                marker.bindPopup(popupContent);
                marker.on('click', () => selectLocation(location));
                marker.on('mouseover', () => marker.setRadius(10));
                marker.on('mouseout', () => marker.setRadius(8));

                marker.addTo(map);
                markers[location.id] = marker;
            });
        }

        // Obtener color según tipo
        function getColorByType(type) {
            const colors = {
                turismo: '#10b981',
                transporte: '#f59e0b',
                comercio: '#ef4444',
                servicios: '#8b5cf6'
            };
            return colors[type] || '#667eea';
        }

        // Seleccionar ubicación
        function selectLocation(location) {
            currentMarker = location;
            
            // Actualizar mapa
            map.setView([location.lat, location.lng], 11);
            markers[location.id].openPopup();
            
            // Actualizar lista
            document.querySelectorAll('.location-item').forEach(item => {
                item.classList.remove('active');
            });
            const activeItem = document.querySelector(`[data-id="${location.id}"]`);
            if (activeItem) {
                activeItem.classList.add('active');
                activeItem.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                const details = activeItem.querySelector('.info-details');
                if (details) details.classList.add('show');
            }
        }

        // Renderizar lista de ubicaciones
        function renderLocationsList(locationsToRender) {
            const listContainer = document.getElementById('locationsList');
            
            if (locationsToRender.length === 0) {
                listContainer.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">🔍</div>
                        <p>No hay resultados para tu búsqueda</p>
                    </div>
                `;
                return;
            }

            listContainer.innerHTML = locationsToRender.map(location => `
                <div class="location-item ${currentMarker?.id === location.id ? 'active' : ''}" data-id="${location.id}">
                    <div class="location-name">${location.name}</div>
                    <span class="location-type ${location.type}">${location.type.toUpperCase()}</span>
                    <div class="location-coords">${location.lat.toFixed(4)}°, ${location.lng.toFixed(4)}°</div>
                    <div class="info-details ${currentMarker?.id === location.id ? 'show' : ''}">
                        <div class="info-text">${location.info}</div>
                        <a href="${location.link}" class="info-link" ${location.link.startsWith('http') ? 'target="_blank" rel="noopener noreferrer"' : ''}>Más información →</a>
                    </div>
                </div>
            `).join('');

            // Agregar event listeners
            document.querySelectorAll('.location-item').forEach(item => {
                item.addEventListener('click', () => {
                    const id = parseInt(item.dataset.id);
                    const location = locations.find(l => l.id === id);
                    if (location) selectLocation(location);
                });
            });
        }

        // Búsqueda
        document.getElementById('searchInput').addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase();
            const filtered = locations.filter(location =>
                location.name.toLowerCase().includes(query) ||
                location.type.toLowerCase().includes(query) ||
                location.city.toLowerCase().includes(query) ||
                location.description.toLowerCase().includes(query)
            );
            renderLocationsList(filtered);
        });

        // Inicializar
        window.addEventListener('load', initMap);
    </script>
</body>
</html>
